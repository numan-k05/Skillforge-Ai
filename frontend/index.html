<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/startup.css" />
    <meta name="theme-color" content="#07111F" />
    <script>
      try {
        const savedTheme = localStorage.getItem("skillforge_theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#F5F7FB" : "#07111F";
      } catch { /* The React theme provider applies the default after startup. */ }
    </script>
    <title>SkillForge AI — Learn Job Skills and Build a Career Roadmap</title>
    <meta name="description" content="Explore practical technology skills, structured courses, career paths, projects, assessments, and personalized learning roadmaps with SkillForge AI." />
    <meta property="og:title" content="SkillForge AI — Learn Job Skills and Build a Career Roadmap" />
    <meta property="og:description" content="Learn practical skills through connected courses, projects, assessments, and career roadmaps." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="robots" content="index,follow" />
    <link rel="preload" href="/fonts/dm-sans-400.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-500.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root">
      <main id="main-content" class="sf-startup" role="status" aria-label="Getting things ready for you…">
        <div class="sf-startup__content">
          <div class="sf-startup__symbol" aria-hidden="true"><div class="sf-startup__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 9a6 6 0 0 1-6 6H6" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="6" r="3" /></svg></div></div>
          <p class="sf-startup__brand" aria-hidden="true">SkillForge <span>AI</span></p>
          <p class="sf-startup__message" aria-hidden="true">Getting things ready for you…</p>
          <div class="sf-startup__track" aria-hidden="true"><span></span></div>
          <p class="sf-startup__caption" aria-hidden="true">Skills. Direction. Progress.</p>
        </div>
      </main>
    </div>
    <noscript><p style="text-align:center;font-family:system-ui">Please enable JavaScript to open SkillForge AI.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
