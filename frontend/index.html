<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111F" />
    <script>
      try {
        const savedTheme = localStorage.getItem("skillforge_theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#F5F7FB" : "#07111F";
      } catch { /* The React theme provider applies the default after startup. */ }
    </script>
    <title>SkillForge AI — Learn Job Skills and Build a Career Roadmap</title>
    <meta name="description" content="Explore practical technology skills, structured courses, career paths, projects, assessments, and personalized learning roadmaps with SkillForge AI." />
    <meta property="og:title" content="SkillForge AI — Learn Job Skills and Build a Career Roadmap" />
    <meta property="og:description" content="Learn practical skills through connected courses, projects, assessments, and career roadmaps." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="robots" content="index,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
